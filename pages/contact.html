<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" href ="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel ="preconnect" href ="https://fonts.googleapis.com">
    <link rel ="preconnect" href ="https://fonts.gstatic.com" crossorigin>
    <link href ="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel ="stylesheet" href ="../styles/contact.css">
    <title>Contact</title>
</head>
<body>
    <header>
        <nav>
            <div class ="logo">
                <a href ="../index.html">
                    <img src ="../images/logo-genesis.png" alt ="Genesis Logo">
                </a>
            </div>

            <div class ="nav-links">
                <a href ="../pages/project.html">Projects</a>
                <a href ="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class ="contact-section">
            <div class ="contact-container">
                <div class ="contact-header">
                    <h2>Full set of great features to make your product fresh</h2>
                    <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
                </div>

                <div class ="contact-form">
                    <form>
                        <div class ="input-group">
                        <label for ="name">Name</label>
                        <input type ="text" id ="name" name ="name" placeholder ="Enter your name">
                        </div>
                        <div class ="input-group">
                            <label for ="email">Email</label>
                            <input type ="email" id ="email" name ="email" placeholder ="Enter your email">
                        </div>
                        <div class ="input-group">
                            <label for ="message">Message</label>
                            <textarea id ="message" name ="message"></textarea>
                        </div>
                        <button type ="submit" class ="submit-btn">Submit</button>
                    </form>
                </div>
            </div>

            <div class="map-container">
                <img src ="../images/map.png" alt ="Location Map">
            </div>
        </section>
    </main>

    <footer>
        <nav>
            <div class ="logo">
                <a href ="../index.html">
                    <img src ="../images/logo-genesis.png" alt ="Genesis Logo">
                </a>
            </div>

            <div class ="nav-links">
                <a href ="../pages/project.html">Projects</a>
                <a href ="contact.html">Contact</a>
                <a href ="#">
                    <img src ="../images/dribbble-logo.png" alt ="Dribbble Logo">
                </a>
                <a href ="#">
                    <img src ="../images/instagram-logo.png" alt ="Instagram Logo">
                </a>
                <a href ="#">
                    <img src ="../images/twitter-logo.png" alt ="Twitter Logo">
                </a>
            </div>
        </nav>
    </footer>
    
</body>
</html>
